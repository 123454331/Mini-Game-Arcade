<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="star-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </radialGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="#090d16" stroke="#38bdf8" stroke-width="2.5" />
  <!-- Cartoon Spaceship -->
  <polygon points="32,10 46,44 32,38 18,44" fill="#f0f9ff" stroke="#38bdf8" stroke-width="2" stroke-linejoin="round" />
  <!-- Wing fins -->
  <polygon points="32,22 48,46 32,40 16,46" fill="#0284c7" />
  <!-- Canopy -->
  <ellipse cx="32" cy="24" rx="4.5" ry="7" fill="#67e8f9" stroke="#ffffff" stroke-width="1" />
  <!-- Thruster flame -->
  <polygon points="30,42 34,42 32,54" fill="#facc15" />
</svg>

