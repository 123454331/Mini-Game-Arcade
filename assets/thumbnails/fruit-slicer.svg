<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="fs-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141824" />
      <stop offset="50%" stop-color="#1e1832" />
      <stop offset="100%" stop-color="#0f111a" />
    </linearGradient>
    <linearGradient id="blade-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.95)" />
      <stop offset="60%" stop-color="rgba(56, 189, 248, 0.8)" />
      <stop offset="100%" stop-color="rgba(56, 189, 248, 0)" />
    </linearGradient>
  </defs>

  <!-- Dark wood/arcade slate background -->
  <rect width="600" height="360" fill="url(#fs-bg)" />

  <!-- Splatter drops -->
  <circle cx="160" cy="120" r="14" fill="#ef4444" opacity="0.35" />
  <circle cx="180" cy="95" r="7" fill="#ef4444" opacity="0.4" />
  <circle cx="140" cy="140" r="9" fill="#ef4444" opacity="0.3" />
  <circle cx="430" cy="220" r="16" fill="#f97316" opacity="0.35" />
  <circle cx="455" cy="245" r="8" fill="#f97316" opacity="0.4" />

  <!-- Sliced Watermelon Half 1 (Left, flying upward) -->
  <g transform="translate(190, 160) rotate(-24)">
    <!-- Green Rind -->
    <path d="M -50 0 A 50 50 0 0 1 50 0 Z" fill="#15803d" stroke="#166534" stroke-width="3" />
    <!-- White Rind Band -->
    <path d="M -44 0 A 44 44 0 0 1 44 0 Z" fill="#bbf7d0" />
    <!-- Red Flesh -->
    <path d="M -40 0 A 40 40 0 0 1 40 0 Z" fill="#ef4444" />
    <!-- Seeds -->
    <ellipse cx="-20" cy="16" rx="2" ry="3.5" fill="#18181b" />
    <ellipse cx="0" cy="22" rx="2" ry="3.5" fill="#18181b" />
    <ellipse cx="20" cy="16" rx="2" ry="3.5" fill="#18181b" />
  </g>

  <!-- Sliced Watermelon Half 2 (Right, flying downward) -->
  <g transform="translate(260, 205) rotate(16)">
    <path d="M -50 0 A 50 50 0 0 0 50 0 Z" fill="#15803d" stroke="#166534" stroke-width="3" />
    <path d="M -44 0 A 44 44 0 0 0 44 0 Z" fill="#bbf7d0" />
    <path d="M -40 0 A 40 40 0 0 0 40 0 Z" fill="#ef4444" />
    <ellipse cx="-18" cy="-16" rx="2" ry="3.5" fill="#18181b" />
    <ellipse cx="18" cy="-16" rx="2" ry="3.5" fill="#18181b" />
  </g>

  <!-- Whole Orange (Upper Right) -->
  <g transform="translate(420, 130)">
    <circle cx="0" cy="0" r="38" fill="#f97316" stroke="#ea580c" stroke-width="3" />
    <path d="M 0 -38 Q 12 -48 20 -42 Q 10 -34 0 -38" fill="#22c55e" />
    <circle cx="-10" cy="-12" r="2.5" fill="#fdba74" />
    <circle cx="12" cy="14" r="2.5" fill="#c2410c" />
  </g>

  <!-- Whole Banana (Lower Left) -->
  <g transform="translate(110, 260) rotate(35)">
    <path d="M -45 -15 Q 0 25 50 5 Q 0 8 -45 -15" fill="#facc15" stroke="#ca8a04" stroke-width="2.5" />
    <circle cx="-45" cy="-15" r="3.5" fill="#854d0e" />
  </g>

  <!-- Dangerous Bomb with Sizzling Fuse (Right) -->
  <g transform="translate(490, 250)">
    <!-- Bomb body -->
    <circle cx="0" cy="0" r="28" fill="#18181b" stroke="#3f3f46" stroke-width="3" />
    <ellipse cx="-8" cy="-10" rx="6" ry="3" fill="#52525b" />
    <!-- Bomb cap -->
    <rect x="-6" y="-34" width="12" height="7" rx="2" fill="#71717a" />
    <!-- Fuse cord -->
    <path d="M 0 -34 Q 8 -46 16 -40" fill="none" stroke="#d97706" stroke-width="3" />
    <!-- Sizzling spark -->
    <circle cx="17" cy="-40" r="5" fill="#ef4444" />
    <polygon points="17,-48 19,-42 25,-40 19,-38 17,-32 15,-38 9,-40 15,-42" fill="#facc15" />
  </g>

  <!-- Glowing Katana / Blade Slash Trail across screen -->
  <path d="M 90 280 Q 280 130 480 70" fill="none" stroke="url(#blade-gradient)" stroke-width="7" stroke-linecap="round" />
  <path d="M 120 270 Q 280 130 460 80" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />

  <!-- Slash sparks -->
  <circle cx="270" cy="140" r="4" fill="#ffffff" />
  <polygon points="270,132 272,138 278,140 272,142 270,148 268,142 262,140 268,138" fill="#38bdf8" />
  <polygon points="340,112 342,118 348,120 342,122 340,128 338,122 332,120 338,118" fill="#facc15" />

  <!-- Badge Overlay -->
  <rect x="20" y="20" width="130" height="32" rx="16" fill="rgba(15, 23, 42, 0.85)" stroke="#f97316" stroke-width="1.5" />
  <text x="85" y="41" fill="#f97316" font-family="system-ui, sans-serif" font-weight="800" font-size="13" text-anchor="middle" letter-spacing="1">ARCADE</text>
</svg>

