<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="cd-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0c1a30" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <radialGradient id="cd-nebula" cx="65%" cy="35%" r="60%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0.35)" />
      <stop offset="50%" stop-color="rgba(192, 132, 252, 0.2)" />
      <stop offset="100%" stop-color="rgba(0,0,0,0)" />
    </radialGradient>
    <radialGradient id="shield-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0.6)" />
      <stop offset="80%" stop-color="rgba(56, 189, 248, 0.2)" />
      <stop offset="100%" stop-color="rgba(56, 189, 248, 0)" />
    </radialGradient>
  </defs>

  <!-- Deep space background -->
  <rect width="600" height="360" fill="url(#cd-bg)" />
  <rect width="600" height="360" fill="url(#cd-nebula)" />

  <!-- Background stars -->
  <circle cx="60" cy="80" r="1.5" fill="#fff" opacity="0.8" />
  <circle cx="140" cy="40" r="2" fill="#38bdf8" opacity="0.9" />
  <circle cx="220" cy="110" r="1" fill="#fff" opacity="0.6" />
  <circle cx="520" cy="90" r="2" fill="#facc15" opacity="0.8" />
  <circle cx="480" cy="220" r="1.5" fill="#fff" opacity="0.7" />
  <circle cx="80" cy="280" r="2" fill="#fff" opacity="0.8" />
  <circle cx="560" cy="300" r="1.5" fill="#38bdf8" opacity="0.8" />

  <!-- Asteroid 1 (Large, left) -->
  <g transform="translate(130, 160)">
    <polygon points="-40,-15 -20,-45 25,-35 45,-5 35,35 -10,45 -45,15" fill="#475569" stroke="#94a3b8" stroke-width="4" stroke-linejoin="round" />
    <circle cx="-10" cy="-10" r="9" fill="#1e293b" />
    <circle cx="15" cy="15" r="7" fill="#1e293b" />
  </g>

  <!-- Asteroid 2 (Small, fast, right) -->
  <g transform="translate(460, 110)">
    <polygon points="-18,-5 -8,-20 12,-15 22,-2 15,18 -5,22 -20,8" fill="#64748b" stroke="#cbd5e1" stroke-width="3" stroke-linejoin="round" />
    <circle cx="2" cy="0" r="4" fill="#334155" />
  </g>

  <!-- Golden Energy Star -->
  <g transform="translate(420, 240)">
    <circle cx="0" cy="0" r="20" fill="rgba(250, 204, 21, 0.3)" />
    <polygon points="0,-16 5,-5 16,-5 7,3 10,14 0,7 -10,14 -7,3 -16,-5 -5,-5" fill="#facc15" stroke="#ca8a04" stroke-width="2" />
  </g>

  <!-- Player Spaceship with Shield -->
  <g transform="translate(300, 190)">
    <!-- Shield bubble -->
    <circle cx="0" cy="0" r="62" fill="url(#shield-glow)" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="12 4" />
    
    <!-- Thruster fire -->
    <polygon points="-12,30 -6,55 0,32" fill="#facc15" />
    <polygon points="12,30 6,55 0,32" fill="#facc15" />
    <polygon points="-8,30 -6,44 -4,32" fill="#38bdf8" />
    <polygon points="8,30 6,44 4,32" fill="#38bdf8" />

    <!-- Ship Wings -->
    <polygon points="0,-36 24,-8 40,24 24,30 8,24 0,28 -8,24 -24,30 -40,24 -24,-8" fill="#0284c7" stroke="#38bdf8" stroke-width="3" stroke-linejoin="round" />
    <!-- Fuselage Body -->
    <polygon points="0,-32 14,8 6,24 -6,24 -14,8" fill="#f0f9ff" stroke="#0284c7" stroke-width="2" />
    <!-- Glass Canopy -->
    <ellipse cx="0" cy="-6" rx="9" ry="14" fill="#0ea5e9" stroke="#ffffff" stroke-width="2" />
    <ellipse cx="-3" cy="-10" rx="3" ry="6" fill="#ffffff" opacity="0.8" />
  </g>

  <!-- Title Badge Overlay -->
  <rect x="20" y="20" width="150" height="32" rx="16" fill="rgba(15, 23, 42, 0.85)" stroke="#38bdf8" stroke-width="1.5" />
  <text x="95" y="41" fill="#38bdf8" font-family="system-ui, sans-serif" font-weight="800" font-size="13" text-anchor="middle" letter-spacing="1">SURVIVAL</text>
</svg>

